name: Bug report
description: Something in expo-morph-carousel does not work as documented
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. English or Vietnamese is fine.
        Security problem? Do not file it here, see SECURITY.md.

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest code that shows the problem, ideally the `<MorphCarousel>` props you use. A change to the `example/` app or a link to a repository is best.
      render: tsx
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: expo-morph-carousel version
      placeholder: '0.1.0'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `npx expo --version` and `npm ls react-native react-native-reanimated react-native-gesture-handler @shopify/react-native-skia`.
      render: text
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - Android
        - Web
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: 'iPhone 16 simulator, iOS 27 / Pixel 8, Android 16 / Chrome 140'
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Expo Go
        - Development build
        - Release build
    validations:
      required: true

  - type: dropdown
    id: effect
    attributes:
      label: Effect
      options:
        - liquid
        - crossfade
        - slide
        - parallax
        - stack
        - custom function
    validations:
      required: true

  - type: checkboxes
    id: options
    attributes:
      label: Options in use
      options:
        - label: loop
        - label: autoplay
        - label: direction="vertical"
        - label: mediaPosition="background"
        - label: remote images ({ uri })

  - type: textarea
    id: media
    attributes:
      label: Recording or screenshots
      description: Drag a screen recording here for anything visual. For the liquid effect, a recording of a slow swipe helps most.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and the Troubleshooting section of the README.
          required: true
        - label: The bug still happens after clearing the Metro cache (`npx expo start -c`).
