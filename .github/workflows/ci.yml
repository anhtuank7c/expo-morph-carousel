name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing here pushes

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, ESLint, Prettier
        run: npm run check

      - name: Unit tests (paging math)
        run: npm test

      - name: Build and inspect the package
        run: |
          npm run build
          npm pack --dry-run
